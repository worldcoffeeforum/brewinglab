<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Brewing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: one centered column — header + segmented gauge, guide box, pixel-mosaic canvas stage (kettle / dripper / server), modal over the stage. */
:root {
  --cream: #0E0E0E;
  --sand: #1B1B1B;
  --ink: #EDEDED;
  --roast: #EDEDED;
  --red: #FFFFFF;
  --yellow: #EDEDED;
  --blue: #9A9A9A;
  --ink-soft: #8E8E8E;
  --font-display: 'Pixelify Sans', 'Courier New', monospace;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { background: var(--cream); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 22px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.chips { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.chips i { width: 12px; height: 12px; background: var(--red); box-shadow: 2px 2px 0 #3A3A3A; }
.chips i:nth-child(2) { background: #8E8E8E; }
.chips i:nth-child(3) { background: #555; }
.eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
h1.title { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 8vw, 44px); line-height: 1; text-wrap: balance; margin: 6px 0 0; text-shadow: 3px 3px 0 #555, 6px 6px 0 #222; letter-spacing: .01em; }
.gauge { width: 100%; background: #151515; border: 3px solid var(--ink); box-shadow: 5px 5px 0 #3A3A3A; padding: 12px 14px 10px; }
.gauge-text { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 10px; font-family: var(--font-display); font-size: 16px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.gauge-text b { color: var(--ink); font-weight: 700; font-size: 24px; }
.track { position: relative; height: 20px; border: 3px solid var(--ink); background: var(--sand); margin-top: 8px; overflow: hidden; }
.track #fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: repeating-linear-gradient(90deg, var(--yellow) 0 8px, transparent 8px 10px); }
.track i { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 13px; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
.guide { min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 16px; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 4px 4px 0 #3A3A3A; font-family: var(--font-display); font-weight: 500; font-size: 17px; color: var(--cream); }
.guide.pulse { transform: translate(1px, 1px); box-shadow: 3px 3px 0 #3A3A3A; }
.stage { position: relative; width: 100%; overflow: hidden; border: 3px solid var(--ink); background: var(--cream); box-shadow: 7px 7px 0 #3A3A3A; }
canvas#c { display: block; width: 100%; aspect-ratio: 110 / 155; touch-action: none; cursor: grab; outline: none; image-rendering: pixelated; -webkit-tap-highlight-color: transparent; }
canvas#c.grabbing { cursor: grabbing; }
canvas#c:focus-visible { box-shadow: inset 0 0 0 4px var(--blue); }
.hint { font-size: 12px; color: var(--ink-soft); text-align: center; }
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(0,0,0,.72); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .7s ease, visibility 0s linear .7s; }
.modal.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .7s ease; }
.card { width: 100%; max-width: 360px; background: var(--cream); border: 3px solid var(--ink); padding: 22px 20px 20px; text-align: center; box-shadow: 6px 6px 0 #3A3A3A; transform: translateY(14px); transition: transform .7s steps(7); }
.modal.show .card { transform: none; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; }
.card .sub { margin: 6px 0 0; color: var(--ink-soft); font-weight: 600; }
.notes { margin-top: 16px; text-align: left; background: #151515; border: 3px solid var(--ink); padding: 12px 14px; }
.notes .label { font-family: var(--font-display); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.notes .name { font-family: var(--font-display); font-weight: 700; font-size: 25px; margin-top: 2px; color: var(--red); }
.notes p { margin: 4px 0 10px; font-size: 13.5px; }
.bar { display: grid; grid-template-columns: 82px 1fr 30px; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 14px; color: var(--ink-soft); margin-top: 6px; font-variant-numeric: tabular-nums; }
.bar span:last-child { text-align: right; }
.bar .b { height: 10px; border: 2px solid var(--ink); background: var(--sand); }
.bar .b i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 6px, transparent 6px 8px); width: 0; transition: width 1.1s .5s steps(14); }
.stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-family: var(--font-display); font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.btn { margin-top: 16px; width: 100%; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; color: var(--cream); background: var(--red); border: 3px solid var(--ink); padding: 12px 20px; box-shadow: 4px 4px 0 #3A3A3A; transition: transform .08s steps(2), box-shadow .08s steps(2); }
.btn:hover { background: #CFCFCF; }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #3A3A3A; }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .modal, .card, .bar .b i { transition: none; }
}
</style>
</head>
<body>
<main class="mx-auto w-full flex flex-col items-center gap-5" style="max-width:480px">
  <header class="text-center">
    <div class="chips" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="eyebrow">Pour-over simulator</div>
    <h1 class="title">Digital Brewing Lab</h1>
  </header>

  <section class="gauge" aria-label="Brew progress">
    <div class="gauge-text">
      <span>Current: <b id="curMl">0</b> ml</span>
      <span aria-hidden="true">/</span>
      <span>Target: <b>300</b>ml</span>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="300" aria-valuenow="0" id="track">
      <div id="fill"></div><i style="left:33.33%"></i><i style="left:66.66%"></i>
    </div>
    <div class="ticks"><span>0</span><span>100</span><span>200</span><span>300</span></div>
  </section>

  <p class="guide w-full" id="guide" aria-live="polite">Drag the kettle over the dripper to begin.</p>

  <div class="stage">
    <canvas id="c" tabindex="0" aria-label="Brewing stage. Drag the kettle over the dripper to pour. Keyboard: arrow keys move the kettle, hold Space to pour."></canvas>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-hidden="true">
      <div class="card">
        <h2 id="mTitle">Brewing Complete! ☕</h2>
        <p class="sub">Your Specialty Coffee is Ready.</p>
        <div class="notes">
          <div class="label">Tasting notes</div>
          <div class="name" id="noteName">Balanced &amp; Floral</div>
          <p id="noteText"></p>
          <div id="noteBars"></div>
        </div>
        <div class="stats" id="noteStats"></div>
        <button class="btn" id="again" type="button">Brew Again</button>
      </div>
    </div>
  </div>
  <p class="hint">Touch or mouse: drag the kettle. Keyboard: arrow keys to move, hold Space to pour.</p>
</main>

<script>
(() => {
  const W = 440, H = 620, CX = 220;
  const LW = 110, LH = 155;            /* low-res pixel grid: 1 pixel = 4 stage units */
  const cv = document.getElementById('c'), hi = cv.getContext('2d');
  const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
  const loCtx = lo.getContext('2d', { willReadFrequently: true });
  let ctx = loCtx;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const snap = v => Math.round(v / 4) * 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Pixelify Sans", "Courier New", monospace';

  function fit() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const n = Math.max(2, Math.round(r.width * dpr / LW));
    cv.width = LW * n; cv.height = LH * n;
  }
  new ResizeObserver(fit).observe(cv); fit();
  if (document.fonts && document.fonts.load) document.fonts.load('700 12px "Pixelify Sans"').catch(() => {});

  /* ---------- palette (every pixel is snapped to one of these) ---------- */
  const PALH = {
    g0: '#0A0A0A', g1: '#141414', g2: '#1E1E1E', g3: '#2A2A2A', g4: '#363636', g5: '#444444', g6: '#555555', g7: '#6A6A6A',
    g8: '#7E7E7E', g9: '#929292', ga: '#A8A8A8', gb: '#BDBDBD', gc: '#D0D0D0', gd: '#E2E2E2', ge: '#F2F2F2', gf: '#FFFFFF'
  };
  const PKEYS = Object.keys(PALH), ID = {};
  const PAL = PKEYS.map((k, i) => { ID[k] = i; const h = PALH[k]; return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; });  const lut = new Int16Array(32768).fill(-1);
  function nearest(r, g, b) {
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    let v = lut[key];
    if (v < 0) {
      const R = (r >> 3 << 3) + 4, G = (g >> 3 << 3) + 4, B = (b >> 3 << 3) + 4;
      let best = 1e12; v = 0;
      for (let i = 0; i < PAL.length; i++) {
        const p = PAL[i], dr = R - p[0], dg = G - p[1], db = B - p[2], d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
        if (d < best) { best = d; v = i; }
      }
      lut[key] = v;
    }
    return v;
  }
  const idx = new Uint8Array(LW * LH);
  function quantize() {
    const img = loCtx.getImageData(0, 0, LW, LH), d = img.data;
    for (let i = 0, j = 0; i < idx.length; i++, j += 4) idx[i] = nearest(d[j], d[j + 1], d[j + 2]);
    for (let i = 0, j = 0; i < idx.length; i++, j += 4) { const p = PAL[idx[i]]; d[j] = p[0]; d[j + 1] = p[1]; d[j + 2] = p[2]; d[j + 3] = 255; }    loCtx.putImageData(img, 0, 0);
  }

  /* ---------- geometry ---------- */
  const CONE_TOP = 250, CONE_BOT = 342, TOP_HALF = 88, BOT_HALF = 16, BED_Y = 274;
  const coneHalf = y => TOP_HALF - (y - CONE_TOP) / (CONE_BOT - CONE_TOP) * (TOP_HALF - BOT_HALF);
  const NC = 45, C0 = CX - 88, CSTEP = 176 / (NC - 1), SW = 17;
  const Y0 = 592, Y300 = 432, IL = 141, IR = 299;
  const levelY = ml => Y0 - (Y0 - Y300) * ml / 300;
  const TARGET = 300, DROP_ML = 1.2;

  /* ---------- state ---------- */
  const wet = new Float32Array(NC), wetTmp = new Float32Array(NC);
  const NH = 34, hf = new Float32Array(NH), hv = new Float32Array(NH);
  let stream = [], splashes = [], drops = [], bubbles = [], confetti = [];
  const S = {};
  let T = 0, modalTimer = 0, guideText = '';

  function reset() {
    clearTimeout(modalTimer);
    Object.assign(S, {
      phase: 'brew', ml: 0, disp: 0, bedW: 0, pourClock: 0, dripAcc: 0, dripOn: false,
      kx: 135, ky: 100, tx: 135, ty: 100, tilt: 0, pointer: false, key: false, dragging: false,
      pouring: false, wasPouring: false, seg: 0, interrupts: 0, devSum: 0, flood: 0,
      started: false, t0: 0, agit: 0, sp: 0, wonT: 0, burst2: false
    });
    wet.fill(0); hf.fill(0); hv.fill(0);
    stream = []; splashes = []; drops = []; bubbles = []; confetti = [];
    const m = $('modal'); m.classList.remove('show'); m.setAttribute('aria-hidden', 'true');
    ui(true);
  }

  /* ---------- input ---------- */
  let grab = { x: 0, y: 0 };
  const lp = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  const moveTo = p => { S.tx = clamp(p.x + grab.x, 110, 372); S.ty = clamp(p.y + grab.y, 62, 195); };
  cv.addEventListener('pointerdown', e => {
    if (S.phase !== 'brew') return;
    const p = lp(e);
    const hit = p.x > S.kx - 115 && p.x < S.kx + 85 && p.y > S.ky - 60 && p.y < S.ky + 50;
    if (!hit && p.y > 250) return;
    grab = hit ? { x: S.kx - p.x, y: S.ky - p.y } : { x: 0, y: 0 };
    S.pointer = true; cv.classList.add('grabbing');
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    moveTo(p); e.preventDefault();
  });
  cv.addEventListener('pointermove', e => { if (S.pointer) moveTo(lp(e)); });
  const release = () => { S.pointer = false; cv.classList.remove('grabbing'); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, release));
  cv.addEventListener('keydown', e => {
    if (S.phase !== 'brew') return;
    const k = e.key, st = 14;
    if (k === 'ArrowLeft') S.tx = clamp(S.tx - st, 110, 372);
    else if (k === 'ArrowRight') S.tx = clamp(S.tx + st, 110, 372);
    else if (k === 'ArrowUp') S.ty = clamp(S.ty - st, 62, 195);
    else if (k === 'ArrowDown') S.ty = clamp(S.ty + st, 62, 195);
    else if (k === ' ' || k === 'Enter') S.key = true;
    else return;
    e.preventDefault();
  });
  cv.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') S.key = false; });
  cv.addEventListener('blur', () => { S.key = false; });
  $('again').addEventListener('click', reset);

  /* ---------- helpers ---------- */
  function tip(kx, ky, a) {
    const t = -a * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    return { x: kx + (-100 * c + 34 * s), y: ky + (-100 * s - 34 * c) };
  }
  function surfaceAt(x) {
    const f = clamp((x - C0) / CSTEP, 0, NC - 1), i = Math.min(NC - 2, Math.floor(f)), u = f - i;
    const w = wet[i] * (1 - u) + wet[i + 1] * u;
    return BED_Y - 3 * Math.min(1, S.pourClock / 8) - w * SW;
  }
  function hfAt(x) {
    const f = clamp((x - IL) / (IR - IL) * (NH - 1), 0, NH - 1.001), i = Math.floor(f), u = f - i;
    return hf[i] * (1 - u) + hf[i + 1] * u;
  }
  function waveOff(x) {
    const A = 2.6 + S.agit * 5;
    return A * (Math.sin(x * 0.07 + T * 3.1) + 0.55 * Math.sin(x * 0.13 - T * 4.3)) + hfAt(x);
  }
  const liquidSurface = x => levelY(S.disp) + waveOff(x);

  /* ---------- simulation ---------- */
  function spawnDrop() { drops.push({ x: CX + rnd(-1.2, 1.2), y: 368, vy: 0, r: 0.8, age: 0 }); }

  function land(d) {
    if (S.phase === 'brew') {
      S.ml = Math.min(TARGET, S.ml + DROP_ML);
      if (S.ml >= TARGET) { S.phase = 'fill'; S.wasPouring = false; S.pouring = false; }
    }
    const i = Math.round(clamp((d.x - IL) / (IR - IL), 0, 1) * (NH - 1));
    hv[i] -= 3.4; if (i > 0) hv[i - 1] -= 2; if (i < NH - 1) hv[i + 1] -= 2;
    S.agit = Math.min(1.6, S.agit + 0.35);
    for (let k = 0; k < 4; k++) splashes.push({ x: d.x, y: liquidSurface(d.x), vx: rnd(-50, 50), vy: -rnd(60, 140), life: 0.45, age: 0, g: 900, c: '#A8A8A8', inGlass: true });
  }

  function stepHF(dt) {
    const n = Math.max(1, Math.min(3, Math.round(dt * 60)));
    for (let s = 0; s < n; s++) {
      for (let i = 0; i < NH; i++) {
        const l = hf[i ? i - 1 : 0], r = hf[i < NH - 1 ? i + 1 : NH - 1];
        hv[i] += (l + r - 2 * hf[i]) * 0.22 - hf[i] * 0.012; hv[i] *= 0.985;
      }
      for (let i = 0; i < NH; i++) hf[i] = clamp(hf[i] + hv[i], -9, 9);
    }
  }

  function addWet(x) {
    for (let i = 0; i < NC; i++) {
      const d = (C0 + i * CSTEP - x) / 13;
      if (d > -3 && d < 3) wet[i] = Math.min(1, wet[i] + 0.0016 * Math.exp(-d * d));
    }
  }

  function update(dt) {
    T += dt;
    S.kx += (S.tx - S.kx) * Math.min(1, dt * 16);
    S.ky += (S.ty - S.ky) * Math.min(1, dt * 16);
    S.dragging = S.pointer || S.key;

    const t15 = tip(S.kx, S.ky, 15);
    S.pouring = S.phase === 'brew' && S.dragging && t15.x > 168 && t15.x < 272 && t15.y < 244;
    if (S.pouring) S.tilt += (15 - S.tilt) * Math.min(1, dt * 12); else S.tilt = 0;

    if (S.pouring) {
      if (!S.started) { S.started = true; S.t0 = performance.now(); }
      S.pourClock += dt; S.seg += dt;
      const tp = tip(S.kx, S.ky, S.tilt);
      S.devSum += Math.abs(tp.x - CX) * dt;
      if (S.bedW < 100) S.bedW += 14 * dt; else S.flood += dt;
      S.sp += 260 * dt;
      while (S.sp >= 1) {
        S.sp -= 1;
        const vy = rnd(40, 90);
        stream.push({ x: tp.x + rnd(-1, 1), y: tp.y + vy * rnd(0, dt), vx: rnd(-30, -12), vy, r: rnd(1.6, 2.6) });
      }
    }
    if (S.wasPouring && !S.pouring && S.phase === 'brew' && S.seg > 0.4) S.interrupts++;
    if (!S.pouring) S.seg = 0;
    S.wasPouring = S.pouring;

    /* stream particles */
    for (let i = stream.length - 1; i >= 0; i--) {
      const p = stream[i];
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      let dead = p.y > H;
      if (!dead && p.y >= CONE_TOP) {
        const sy = surfaceAt(p.x);
        if (Math.abs(p.x - CX) > coneHalf(Math.min(p.y, CONE_BOT)) - 1) dead = true;
        else if (p.y >= sy) {
          dead = true; addWet(p.x);
          if (Math.random() < 0.3) splashes.push({ x: p.x, y: sy, vx: rnd(-40, 40), vy: -rnd(30, 90), life: 0.35, age: 0, g: 700, c: '#E2E2E2' });
        }
      }
      if (dead) { stream[i] = stream[stream.length - 1]; stream.pop(); }
    }

    /* bed: wetness spread/decay, bubbles */
    for (let i = 0; i < NC; i++) {
      const l = wet[i ? i - 1 : 0], r = wet[i < NC - 1 ? i + 1 : NC - 1];
      wetTmp[i] = Math.max(0, wet[i] + (l + r - 2 * wet[i]) * 0.12 - dt * (S.pouring ? 0.02 : 0.05));
    }
    wet.set(wetTmp);
    if (bubbles.length < 90) {
      for (let i = 0; i < NC; i++) {
        if (wet[i] > 0.22 && Math.random() < wet[i] * dt * 1.1) {
          const x = C0 + i * CSTEP + rnd(-3, 3);
          if (Math.abs(x - CX) < coneHalf(BED_Y) - 6) bubbles.push({ x, rm: rnd(2.4, 5.5), age: 0, life: rnd(0.5, 1.0), popped: false });
        }
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i]; b.age += dt;
      if (!b.popped && b.age >= b.life) {
        b.popped = true;
        for (let k = 0; k < 3; k++) splashes.push({ x: b.x, y: surfaceAt(b.x) - b.rm, vx: rnd(-30, 30), vy: -rnd(25, 70), life: 0.4, age: 0, g: 260, c: '#D0D0D0' });
      }
      if (b.age > b.life + 0.18) { bubbles[i] = bubbles[bubbles.length - 1]; bubbles.pop(); }
    }

    /* drip: starts exactly 1.5 s after pouring begins */
    if (S.phase === 'brew' && S.pourClock >= 1.5) {
      if (!S.dripOn) { S.dripOn = true; spawnDrop(); }
      const ramp = Math.min(1, 0.35 + (S.pourClock - 1.5) * 0.65);
      const drain = Math.min(11, 0.5 * S.bedW) * ramp;
      S.bedW = Math.max(0, S.bedW - drain * dt);
      S.dripAcc += drain * dt;
      while (S.dripAcc >= DROP_ML) { S.dripAcc -= DROP_ML; spawnDrop(); }
    } else if (S.phase !== 'brew') {
      S.bedW = Math.max(0, S.bedW - 12 * dt);
    }

    /* drops */
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.age += dt;
      let dead = false;
      if (d.age < 0.12) d.r = 0.8 + (d.age / 0.12) * 2.4;
      else {
        d.vy += 1200 * dt; d.y += d.vy * dt;
        if (d.y + d.r >= liquidSurface(d.x)) { land(d); dead = true; }
      }
      if (dead) { drops[i] = drops[drops.length - 1]; drops.pop(); }
    }

    /* splashes */
    for (let i = splashes.length - 1; i >= 0; i--) {
      const p = splashes[i]; p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.age > p.life || (p.inGlass && p.y > liquidSurface(p.x) && p.vy > 0)) { splashes[i] = splashes[splashes.length - 1]; splashes.pop(); }
    }

    stepHF(dt);
    S.agit *= Math.exp(-dt * 1.8);
    S.disp += (S.ml - S.disp) * Math.min(1, dt * 6);

    /* win */
    if (S.phase === 'fill' && S.disp >= TARGET - 0.6) {
      S.phase = 'won'; S.disp = TARGET; S.wonT = 0;
      burst(0); showModal();
    }
    if (S.phase === 'won') {
      S.wonT += dt;
      if (!S.burst2 && S.wonT > 0.5) { S.burst2 = true; burst(1); }
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy += 520 * dt; c.vx *= Math.pow(0.55, dt); c.vy *= Math.pow(0.8, dt);
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.y > H + 20) { confetti[i] = confetti[confetti.length - 1]; confetti.pop(); }
    }
  }

  /* ---------- win: confetti + modal ---------- */
  const GOLD = ['#FFFFFF', '#D8D8D8', '#BDBDBD', '#EDEDED', '#9A9A9A', '#F2F2F2'];
  function burst(kind) {
    const n = reduce ? 40 : 120;
    for (let i = 0; i < n; i++) {
      let x, y, a, sp;
      if (kind === 0) {
        const side = i % 3;
        if (side === 0) { x = 10; y = H * 0.72; a = rnd(-1.35, -0.7); }
        else if (side === 1) { x = W - 10; y = H * 0.72; a = rnd(-2.45, -1.8); }
        else { x = CX + rnd(-30, 30); y = 330; a = rnd(-2.0, -1.15); }
        sp = rnd(380, 820);
      } else { x = rnd(0, W); y = rnd(-40, 0); a = Math.PI / 2 + rnd(-0.4, 0.4); sp = rnd(60, 220); }
      confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rnd(0, 6.28), vr: rnd(-9, 9), col: GOLD[(Math.random() * GOLD.length) | 0] });
    }
  }

  function showModal() {
    const secs = Math.round((performance.now() - S.t0) / 1000);
    const avgDev = S.devSum / Math.max(0.1, S.pourClock);
    const score = Math.round(clamp(100 - S.interrupts * 9 - avgDev * 0.5 - S.flood * 2, 0, 100));
    let name, text;
    if (score >= 80) { name = 'Balanced & Floral'; text = 'Jasmine and bergamot up front with a clean, honeyed finish. A steady pour kept the extraction even and bright.'; }
    else if (score >= 55) { name = 'Sweet & Silky'; text = 'Caramel sweetness, soft stone fruit and a smooth, rounded body. A few pauses added depth without losing clarity.'; }
    else { name = 'Rich & Bold'; text = 'Dark chocolate, toasted nuts and a heavy, lingering body. The stop-and-go pour pushed extraction deep.'; }
    const bright = clamp(35 + score * 0.6, 8, 98), body = clamp(95 - score * 0.55, 10, 96), sweet = clamp(60 + (score - 60) * 0.2, 20, 90);
    $('noteName').textContent = name; $('noteText').textContent = text;
    const bars = [['Brightness', bright], ['Body', body], ['Sweetness', sweet]];
    $('noteBars').innerHTML = bars.map(([l, v]) => `<div class="bar"><span>${l}</span><span class="b"><i data-w="${Math.round(v)}"></i></span><span>${Math.round(v)}</span></div>`).join('');
    $('noteStats').innerHTML = `<span>Steadiness <b>${score}%</b></span><span>Brew time <b>${secs}s</b></span><span>Pauses <b>${S.interrupts}</b></span>`;
    modalTimer = setTimeout(() => {
      const m = $('modal'); m.classList.add('show'); m.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => document.querySelectorAll('#noteBars i').forEach(i => i.style.width = i.dataset.w + '%'));
      $('again').focus({ preventScroll: true });
    }, 900);
  }

  /* ---------- UI text ---------- */
  function guideMsg() {
    if (S.phase !== 'brew') return 'Beautiful. Your coffee is ready!';
    if (S.ml >= 270) return 'Almost there! Just a little more...';
    if (S.ml >= 240) return 'Almost there!';
    if (!S.started) return S.dragging ? 'Move over the dripper. The kettle tilts and pours.' : 'Drag the kettle over the dripper to begin.';
    if (S.bedW >= 88) return 'Slow down. Lift the kettle and let the bed drain.';
    if (S.ml < 12) return 'Pour slowly to bloom...';
    if (!S.pouring) return 'Move the kettle back over the dripper to keep pouring.';
    if (S.bedW >= 12) return 'Perfect flow rate!';
    return 'Keep a steady, gentle pour...';
  }
  let lastMl = -1;
  function ui(force) {
    const g = guideMsg();
    if (g !== guideText) {
      guideText = g; const el = $('guide'); el.textContent = g;
      el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 250);
    }
    const ml = Math.round(S.disp);
    if (force || ml !== lastMl) {
      lastMl = ml; $('curMl').textContent = ml;
      $('fill').style.width = (S.disp / TARGET * 100).toFixed(1) + '%';
      $('track').setAttribute('aria-valuenow', ml);
    }
  }

  /* ---------- coffee-ground texture: one texel = one pixel ---------- */
  const tex = document.createElement('canvas'); tex.width = 46; tex.height = 30;
  (() => {
    const c = tex.getContext('2d');
    let s = 1337; const r = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const cols = ['#363636', '#444444', '#444444', '#555555', '#555555', '#6A6A6A', '#7E7E7E', '#2A2A2A'];
    for (let y = 0; y < 30; y++) for (let x = 0; x < 46; x++) {
      const bias = y / 30, k = Math.min(cols.length - 1, Math.floor((r() * 0.75 + (1 - bias) * 0.25) * cols.length));
      c.fillStyle = cols[k]; c.fillRect(x, y, 1, 1);
    }
  })();

  /* ---------- drawing (scene goes to the low-res canvas) ---------- */
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function glassPath(c, i) {
    const L = 136 + i, R = 304 - i, rl = 148 + i, rr_ = 292 - i, B = 602 - i;
    c.beginPath(); c.moveTo(rl, 358); c.lineTo(rr_, 358);
    c.bezierCurveTo(rr_, 395, R, 410, R, 440); c.lineTo(R, B - 28); c.quadraticCurveTo(R, B, R - 28, B);
    c.lineTo(L + 28, B); c.quadraticCurveTo(L, B, L, B - 28); c.lineTo(L, 440);
    c.bezierCurveTo(L, 410, rl, 395, rl, 358); c.closePath();
  }
  function coneP(c) {
    c.beginPath(); c.moveTo(CX - TOP_HALF, CONE_TOP); c.lineTo(CX + TOP_HALF, CONE_TOP);
    c.lineTo(CX + BOT_HALF, CONE_BOT); c.lineTo(CX - BOT_HALF, CONE_BOT); c.closePath();
  }

  function drawBackdrop() {
    ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2A2A2A'; ctx.fillRect(0, 604, W, H - 604);
    ctx.fillStyle = '#0A0A0A'; ctx.fillRect(CX - 112, 604, 224, 8);
  }

  function drawServerBack() {
    glassPath(ctx, 0); ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fill();
    if (S.disp > 0.15) {
      ctx.save(); glassPath(ctx, 4); ctx.clip();
      const L = levelY(S.disp);
      ctx.beginPath(); ctx.moveTo(IL - 6, L + waveOff(IL - 6));
      for (let x = IL - 6; x <= IR + 6; x += 4) ctx.lineTo(x, L + waveOff(x));
      ctx.lineTo(IR + 6, 640); ctx.lineTo(IL - 6, 640); ctx.closePath();
      const g = ctx.createLinearGradient(0, L - 4, 0, 602);
      g.addColorStop(0, 'rgba(176,176,176,.92)'); g.addColorStop(0.25, 'rgba(128,128,128,.94)'); g.addColorStop(1, 'rgba(70,70,70,.97)');
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); for (let x = IL - 6; x <= IR + 6; x += 4) { const y = L + waveOff(x); x === IL - 6 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.lineJoin = 'round'; ctx.strokeStyle = '#F2F2F2'; ctx.lineWidth = 4; ctx.stroke();
      ctx.restore();
    }
    /* rim sits behind the dripper's base disc */
    ctx.strokeStyle = '#929292'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(144, 358); ctx.lineTo(296, 358); ctx.stroke();
  }

  function drawServerFront() {
    glassPath(ctx, 0); ctx.strokeStyle = '#929292'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(152, 452); ctx.lineTo(152, 572); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(288, 480); ctx.lineTo(288, 548); ctx.stroke();
  }

  function drawDripper() {
    /* spout nub + base disc */
    ctx.fillStyle = '#A8A8A8'; ctx.fillRect(212, 352, 16, 16);
    ctx.fillStyle = '#A8A8A8'; ctx.fillRect(156, 340, 128, 16);
    ctx.fillStyle = '#E2E2E2'; ctx.fillRect(156, 340, 128, 4);
    ctx.fillStyle = '#6A6A6A'; ctx.fillRect(156, 352, 128, 4);

    coneP(ctx); ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fill();

    ctx.save(); coneP(ctx); ctx.clip();
    /* pooled water above grounds */
    const ph = clamp((S.bedW - 35) / 65, 0, 1) * 20;
    if (ph > 0.5) {
      const yp = BED_Y - 3 - ph;
      ctx.fillStyle = 'rgba(150,150,150,.55)'; ctx.fillRect(0, yp, W, 120);
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(CX - 90, snap(yp), 180, 4);
    }
    /* grounds clipped to the swelling surface */
    ctx.save();
    ctx.beginPath(); ctx.moveTo(C0 - 4, 360);
    const sy = [];
    for (let i = 0; i < NC; i++) { const x = C0 + i * CSTEP, y = surfaceAt(x); sy.push(y); ctx.lineTo(x, y); }
    ctx.lineTo(C0 + 180, 360); ctx.closePath(); ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tex, 128, 228, 184, 120);
    ctx.restore();
    /* wet sheen along the surface */
    for (let i = 0; i < NC - 1; i++) {
      const w = (wet[i] + wet[i + 1]) / 2, x0 = C0 + i * CSTEP, x1 = x0 + CSTEP;
      ctx.beginPath(); ctx.moveTo(x0, sy[i]); ctx.lineTo(x1, sy[i + 1]);
      ctx.strokeStyle = `rgba(0,0,0,${(0.3 + w * 0.4).toFixed(2)})`; ctx.lineWidth = 8; ctx.stroke();
      if (w > 0.15) { ctx.strokeStyle = `rgba(215,215,215,${(0.3 + w * 0.5).toFixed(2)})`; ctx.lineWidth = 4; ctx.stroke(); }
    }
    /* bubbles: tan pixel blobs that pop into a ring */
    for (const b of bubbles) {
      const px = snap(b.x), py = snap(surfaceAt(b.x) - 6);
      if (!b.popped) {
        const big = b.rm > 3.8 && b.age > b.life * 0.4;
        ctx.fillStyle = '#D0D0D0'; ctx.fillRect(px, py, big ? 8 : 4, big ? 8 : 4);
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(px, py, 4, 4);
      } else {
        ctx.fillStyle = '#F2F2F2';
        ctx.fillRect(px - 4, py, 4, 4); ctx.fillRect(px + 8, py, 4, 4); ctx.fillRect(px + 2, py - 6, 4, 4); ctx.fillRect(px + 2, py + 6, 4, 4);
      }
    }
    ctx.restore();

    /* outline + rim */
    coneP(ctx); ctx.strokeStyle = '#BDBDBD'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.strokeStyle = '#BDBDBD'; ctx.lineWidth = 8; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.ellipse(CX, CONE_TOP, TOP_HALF + 2, 9, 0, 0, 6.2832); ctx.stroke();
  }

  function drawDrops() {
    for (const d of drops) {
      const hang = d.age < 0.12, w = hang ? (d.age < 0.06 ? 4 : 8) : 8;
      const h = hang ? w : 8 + Math.min(8, d.vy / 90) * 1;
      const x = snap(d.x - w / 2), y = hang ? snap(d.y - w / 2) : snap(d.y - h);
      ctx.fillStyle = 'rgba(200,200,200,.95)'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(x, y, 4, 4);
    }
  }

  function drawStream() {
    ctx.lineCap = 'butt'; ctx.strokeStyle = 'rgba(235,235,235,.9)';
    for (const p of stream) {
      ctx.lineWidth = Math.max(4, p.r * 2.4);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.022, p.y - p.vy * 0.03); ctx.stroke();
    }
    for (const p of splashes) {
      ctx.globalAlpha = clamp(1.4 - p.age / p.life, 0, 1);
      ctx.fillStyle = p.c; ctx.fillRect(snap(p.x), snap(p.y), 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  const zoneOn = () => S.phase === 'brew' && !S.pouring;
  function drawDropZone() {
    if (!zoneOn()) return;
    const a = (S.dragging ? 0.95 : 0.6) + Math.sin(T * 3) * 0.1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    ctx.setLineDash([16, 16]); ctx.lineDashOffset = -T * 24; ctx.lineWidth = 4; ctx.strokeStyle = '#E2E2E2';
    ctx.beginPath(); ctx.ellipse(CX, 236, 56, 8, 0, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  function drawKettle() {
    let y = S.ky; if (!S.dragging && S.phase === 'brew') y += Math.sin(T * 1.6) * 3;
    ctx.save(); ctx.translate(S.kx, y); ctx.rotate(-S.tilt * Math.PI / 180);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    /* handle */
    ctx.strokeStyle = '#8A8A8A'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(40, -14); ctx.bezierCurveTo(80, -22, 82, 28, 40, 24); ctx.stroke();
    /* gooseneck spout */
    ctx.strokeStyle = '#A8A8A8'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-34, 20); ctx.bezierCurveTo(-74, 22, -76, -8, -97, -31); ctx.stroke();
    ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-35, 17); ctx.bezierCurveTo(-72, 19, -73, -10, -95, -33); ctx.stroke();
    /* body */
    const bg = ctx.createLinearGradient(-42, 0, 42, 0); bg.addColorStop(0, '#F2F2F2'); bg.addColorStop(0.45, '#BDBDBD'); bg.addColorStop(1, '#8E8E8E');
    ctx.fillStyle = bg; rr(ctx, -42, -26, 84, 62, 14); ctx.fill();
    ctx.fillStyle = '#555555'; ctx.fillRect(-42, 6, 84, 8);
    ctx.fillStyle = '#363636'; ctx.fillRect(-42, 12, 84, 4);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-34, -18, 6, 24);
    /* lid */
    ctx.fillStyle = '#D0D0D0'; ctx.beginPath(); ctx.moveTo(-31, -25); ctx.quadraticCurveTo(0, -54, 31, -25); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7E7E7E'; ctx.fillRect(-6, -50, 12, 12);
    ctx.restore();
  }

  function drawConfetti() {
    for (const c of confetti) {
      const s = Math.abs(Math.sin(c.rot)) > 0.5 ? 8 : 4;
      ctx.fillStyle = c.col; ctx.fillRect(snap(c.x), snap(c.y), s, s);
    }
  }

  /* ---------- overlay: crisp pixel-font labels + mosaic grid on the full-res canvas ---------- */
  let gridPat = null, gridN = 0;
  function drawGrid() {
    const n = cv.width / LW;
    if (gridN !== n) {
      const c = document.createElement('canvas'); c.width = c.height = n;
      const g = c.getContext('2d'), t = Math.max(1, Math.round(n / 8));
      g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(n - t, 0, t, n); g.fillRect(0, n - t, n, t);
      gridPat = hi.createPattern(c, 'repeat'); gridN = n;
    }
    hi.setTransform(1, 0, 0, 1, 0, 0); hi.fillStyle = gridPat; hi.fillRect(0, 0, cv.width, cv.height);
  }
  function drawLabels() {
    const k = cv.width / W;
    hi.setTransform(k, 0, 0, k, 0, 0);
    hi.textAlign = 'right'; hi.textBaseline = 'middle'; hi.font = `700 14px ${FONT}`;
    const surf = levelY(S.disp);
    for (let ml = 20; ml <= 300; ml += 20) {
      const y = levelY(ml), ys = snap(y), major = ml % 100 === 0, len = major ? 28 : 12;
      const under = S.disp > 0.3 && y > surf + 4;
      hi.fillStyle = ml === 300 ? (under ? '#141414' : '#FFFFFF') : under ? '#141414' : '#A8A8A8';
      hi.fillRect(296 - len, ys - 2, len, 4);
      if (major) {
        hi.lineWidth = 4; hi.strokeStyle = under ? 'rgba(0,0,0,0)' : 'rgba(20,20,20,.9)';
        const t = ml + ' ml'; hi.strokeText(t, 262, ys); hi.fillText(t, 262, ys);
      }
    }
    if (zoneOn()) {
      hi.textAlign = 'center'; hi.font = `700 13px ${FONT}`; hi.fillStyle = '#E2E2E2';
      hi.fillText('POUR HERE', CX, 216);
    }
  }

  function render() {
    ctx = loCtx;
    ctx.setTransform(LW / W, 0, 0, LH / H, 0, 0); ctx.imageSmoothingEnabled = false;
    drawBackdrop(); drawServerBack(); drawDrops(); drawDripper(); drawServerFront();
    drawDropZone(); drawStream(); drawKettle(); drawConfetti();
    quantize();
    hi.setTransform(1, 0, 0, 1, 0, 0); hi.imageSmoothingEnabled = false;
    hi.drawImage(lo, 0, 0, cv.width, cv.height);
    drawGrid(); drawLabels();
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render(); ui(false);
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
